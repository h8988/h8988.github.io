      /* Basic reset for header/nav */
      header {
        display: flex;
        align-items: center;

        gap: 16px;
        padding: 12px 16px;
        border-bottom: 1px solid #e5e7eb;
        background: #fff;
      }

      header > div {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      nav {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        gap: 8px;
      }

      nav li {
        margin: 0;
        padding: 0;
      }
