<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Figma 生成页面</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(130deg, #1dc5c1 0%, #b5d26f 40%, #d9f4f0 100%);
        color: #0f172a;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        overflow: hidden;
      }
      .hero {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 100vh;
      }
      .hero::before {
        content: "";
        position: absolute;
        top: -180px;
        left: -120px;
        width: 480px;
        height: 480px;
        background: rgba(255,255,255,0.25);
        border-radius: 50%;
        filter: blur(64px);
      }
      .controls {
        position: relative;
        display: grid;
        grid-template-columns: repeat(2, 150px);
        gap: 16px;
        padding: 44px 32px;
      }
      .action-button {
        width: 150px;
        height: 39px;
        border: none;
        border-radius: 10px;
        background: #359dff;
        box-shadow: 0 18px 40px rgba(53, 157, 255, 0.24);
        cursor: pointer;
      }
      .action-button:focus-visible {
        outline: 3px solid rgba(69, 142, 255, 0.65);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="hero" role="main">
      <section class="controls" aria-label="主要操作按钮">
        <button class="action-button" type="button" aria-label="操作一"></button>
        <button class="action-button" type="button" aria-label="操作二"></button>
      </section>
    </main>
  </body>
</html>
